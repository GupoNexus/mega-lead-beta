<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Mega Lead Connect</title>
    <style>
      body {
        font-family: -apple-system, system-ui, sans-serif;
        width: 280px;
        margin: 0;
        padding: 18px;
        color: #0f172a;
      }
      h1 { font-size: 15px; margin: 0 0 4px; }
      p { font-size: 12px; color: #64748b; line-height: 1.5; margin: 0 0 12px; }
      .status { font-size: 12px; font-weight: 600; padding: 8px 10px; border-radius: 10px; background: #f1f5f9; }
      .ok { background: #dcfce7; color: #166534; }
      .off { background: #fee2e2; color: #991b1b; }
      a.btn {
        display: block; text-align: center; margin-top: 12px; padding: 9px;
        background: #10b981; color: #fff; border-radius: 10px; font-size: 13px;
        font-weight: 600; text-decoration: none;
      }
    </style>
  </head>
  <body>
    <h1>Mega Lead Connect</h1>
    <p>Liga o Mega Lead ao seu WhatsApp Web para enviar e receber mensagens dentro do app.</p>
    <div class="status" id="status">Verificando…</div>
    <a class="btn" href="https://web.whatsapp.com/" target="_blank">Abrir WhatsApp Web</a>
    <script src="popup.js"></script>
  </body>
</html>
